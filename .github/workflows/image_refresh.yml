name: RapidHelp Image Refresher

on:
  schedule:
    - cron: '0 0 * * 0' # 🚀 Every Sunday at Midnight
  workflow_dispatch: # 🚀 Manual Trigger
    inputs:
      state:
        description: 'Target State (e.g. Maharashtra) or leave empty for ALL'
        required: false
        default: ''

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install axios playwright
          npx playwright install chromium
          # 🚀 Automatically install system dependencies for Playwright
          npx playwright install-deps
          sudo apt-get install -y xvfb

      - name: Run Image Refresher (with XVFB for Headed Mode)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" node image_refresher.js "${{ github.event.inputs.state }}"
