name: RapidHelp Image Refresher

on:
  schedule:
    - cron: '0 0 * * 0' # 🚀 Every Sunday at Midnight
  workflow_dispatch: # 🚀 Manual Trigger
    inputs:
      state:
        description: 'Target State (e.g. Maharashtra) or leave empty for ALL'
        required: false
        default: ''

# 🚀 PREVENT CONFLICTS: Wait if scraper or other workers are running
concurrency:
  group: rapidhelp-mega-factory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 🚀 Updated to v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # 🚀 Updated to v4
        with:
          node-version: '20' # 🚀 Unified to Node 20

      - name: Install dependencies
        run: |
          npm install axios playwright
          npx playwright install chromium --with-deps
          sudo apt-get install -y xvfb

      - name: Run Image Refresher (with XVFB for Headed Mode)
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          node image_refresher.js "${{ github.event.inputs.state }}"
