name: RapidHelp Progress Sync Bot

on:
  schedule:
    - cron: '*/45 * * * *' # 🚀 Run every 45 minutes
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install firebase-admin

      - name: Restore Firebase Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json

      - name: Run Sync Script
        run: node sync_firebase_to_git.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "RapidHelp-Bot"
          git config --global user.email "bot@rapidhelp.in"
          git add progress_W*.json
          git commit -m "Automated progress sync from Firebase [skip ci]" || echo "No changes to sync"
          
          # Ultimate resilient push
          for i in {1..10}; do
            git fetch origin main
            if git pull --rebase -X ours origin main; then
              if git push origin main; then
                echo "✅ Progress pushed successfully!"
                break
              fi
            fi
            sleep 10
          done
