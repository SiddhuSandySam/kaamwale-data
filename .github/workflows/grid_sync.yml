name: Dynamic Grid Auto-Sync
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Axios
        run: npm install axios
      - name: Run Robot Script
        run: node auto_sync_grids.js
      - name: Commit and Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "RapidHelp-Robot"
          git config --global user.email "robot@kaamwale.com"
          
          # 🚀 ATOMIC SYNC LOOP
          for i in {1..20}; do
            echo "Attempt $i: Syncing robot updates..."
            
            # 1. Force untrack any accidental large files or node_modules
            git rm -r --cached node_modules maharashtra.json registry.txt 2>/dev/null || true
            
            # 2. Stage only targeted data files
            git add hub_data.json
            git add *_grids/*.json
            
            # 3. Commit
            git commit -m "Robot: Multi-State Data Sync [Auto-Sync]" || { 
              echo "Nothing to sync, checking remote updates..."
            }
            
            # 4. Ultimate Pull & Push
            if git pull --rebase --autostash -X ours origin main; then
              if git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git main; then
                echo "✅ Robot sync successful!"
                exit 0
              fi
            fi
            
            echo "❌ Conflict or Network Error, retrying..."
            git rebase --abort || true
            sleep 20
          done
          exit 1
