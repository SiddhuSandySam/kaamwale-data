name: Dynamic Grid Auto-Sync
on:
  schedule:
    - cron: '0 */4 * * *' # 🚀 Every 4 hours (Incremental)
    - cron: '0 0 * * *'    # 🌑 Midnight (Full Sync)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync Mode'
        required: true
        default: 'incremental'
        type: choice
        options:
        - incremental
        - full

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Axios
        run: npm install axios
      
      - name: Run Robot Script (Full or Incremental)
        run: |
          # Determine mode: Midnight run or manual 'full' input triggers Full Sync
          if [[ "${{ github.event.schedule }}" == "0 0 * * *" ]] || [[ "${{ github.event.inputs.mode }}" == "full" ]]; then
            echo "🚀 Running FULL Sync..."
            node auto_sync_grids.js --full
          else
            echo "📡 Running INCREMENTAL Sync..."
            node auto_sync_grids.js
          fi

      - name: Commit and Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "RapidHelp-Robot"
          git config --global user.email "robot@kaamwale.com"
          
          # 🚀 ATOMIC SYNC LOOP
          for i in {1..20}; do
            echo "Attempt $i: Syncing robot updates..."
            
            # 1. Force untrack any accidental large files or node_modules
            git rm -r --cached node_modules maharashtra.json registry.txt 2>/dev/null || true
            
            # 2. Stage ALL data files dynamically (Matches all states from config)
            git add -A hub_data.json last_sync.json
            git add -A *_grids/ 2>/dev/null || true
            
            # 3. Commit
            git commit -m "Robot: Data Sync [Mode: ${{ github.event.inputs.mode || 'Auto' }}]" || { 
              echo "Nothing to sync, checking remote updates..."
            }
            
            # 4. Ultimate Pull & Push
            if git pull --rebase --autostash -X ours origin main; then
              if git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git main; then
                echo "✅ Robot sync successful!"
                exit 0
              fi
            fi
            
            echo "❌ Conflict or Network Error, retrying..."
            git rebase --abort || true
            sleep 20
          done
          exit 1
