name: Dynamic Grid Auto-Sync
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Axios
        run: npm install axios
      - name: Run Robot Script
        run: node auto_sync_grids.js
      - name: Commit and Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "RapidHelp-Robot"
          git config --global user.email "robot@kaamwale.com"
          git checkout .github/workflows/grid_sync.yml
          
          # 🚀 ATOMIC SYNC LOOP
          for i in {1..20}; do
            echo "Attempt $i: Syncing robot updates..."
            git add hub_data.json *_grids/*.json
            git commit -m "Robot: Multi-State Data Sync [Auto-Sync]" || { echo "Nothing to sync"; exit 0; }
            
            if git pull --rebase origin main; then
              if git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git main; then
                echo "✅ Robot sync successful!"
                exit 0
              fi
            fi
            
            echo "❌ Conflict, retrying..."
            git rebase --abort || true
            sleep 15
          done
          exit 1
