name: Dynamic Grid Auto-Sync
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 🚀 Get full history to avoid push rejection

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Axios
        run: npm install axios
        
      - name: Run Robot Script
        run: node auto_sync_grids.js
        
      - name: Commit and Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "RapidHelp-Robot"
          git config --global user.email "robot@kaamwale.com"
          git add maharashtra_grids/*.json
          git commit -m "Robot: Update dynamic coordinate grids [Auto-Sync]" || exit 0
          # 🚀 Force push to ensure CDN is always updated
          git push --force https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git main
